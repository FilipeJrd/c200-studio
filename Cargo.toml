[workspace]
members = ["crates/c200-core", "crates/c200-linux", "crates/c200-app"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
c200-core = { path = "crates/c200-core" }
c200-linux = { path = "crates/c200-linux" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
