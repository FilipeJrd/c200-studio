name: AppImage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  WINIT_UNIX_BACKEND: x11
  LIBGL_ALWAYS_SOFTWARE: '1'

defaults:
  run:
    shell: bash

jobs:
  appimage:
    name: Build and GUI smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: appimage-ubuntu-22.04
      - name: Build release
        run: cargo build --release --locked -p c200-app
      - name: Open GUI without a camera
        run: |
          mkdir -p dist
          timeout 25s xvfb-run -a target/release/c200-studio --demo --smoke-test --screenshot dist/demo.png
          test -s dist/demo.png
      - name: Install license notice generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Package AppImage
        run: bash scripts/appimage.sh
        env:
          C200_SKIP_BUILD: '1'
      - name: Open packaged GUI without FUSE
        run: |
          timeout 25s xvfb-run -a dist/C200-Studio-x86_64.AppImage --appimage-extract-and-run --demo --smoke-test --screenshot dist/appimage-demo.png
          test -s dist/appimage-demo.png
          cd dist
          sha256sum --check C200-Studio-x86_64.AppImage.sha256
      - name: Upload AppImage, checksum and screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: C200-Studio-linux-x86_64
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/C200-Studio-x86_64.AppImage
            dist/C200-Studio-x86_64.AppImage.sha256
            dist/demo.png
            dist/appimage-demo.png
